[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeos"
version = "0.1.0"
description = "Time Operating System - A modular framework for temporal event systems with causality constraints"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["temporal", "time", "causality", "events", "distributed-systems", "ros2"]

dependencies = [
    "msgpack>=1.0.0",
    "click>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
    "pyqtgraph>=0.13.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "timeos[gui,dev]",
]

[project.scripts]
timeos = "timeos.cli.main:cli"

[project.urls]
Homepage = "https://github.com/t-symmetry/TimeOS"
Repository = "https://github.com/t-symmetry/TimeOS"
Issues = "https://github.com/t-symmetry/TimeOS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["timeos*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
